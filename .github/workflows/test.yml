name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      # The minimum of each engines.node range. Node.js 22 cannot parse `await using`
      # in the test suite, so tsx runs it there.
      - name: Test on Node.js 22.21.1 (engines minimum)
        run: pnpm dlx node@22.21.1 --import tsx tests/index.ts

      - name: Test on Node.js 24.11.0 (engines minimum)
        run: pnpm dlx node@24.11.0 tests/index.ts
