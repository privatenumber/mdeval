skills:
  dirs:
    - .agents/skills

# lintroll is published by this project's maintainer, so its releases skip the age delay
minimumReleaseAgeExclude:
  - lintroll

allowBuilds:
  esbuild: true
  unrs-resolver: false

permissions:
  clean-pkg-json:
    skills: true
  fs-fixture:
    skills: true
  lintroll:
    skills: true
  manten:
    skills: true
