skills:
  dirs:
    - .agents/skills

# These packages are published by this project's maintainer, so their releases skip the age delay
minimumReleaseAgeExclude:
  - clean-pkg-json
  - lintroll

allowBuilds:
  esbuild: true
  unrs-resolver: false

permissions:
  clean-pkg-json:
    skills: true
  fs-fixture:
    skills: true
  lintroll:
    skills: true
  manten:
    skills: true
